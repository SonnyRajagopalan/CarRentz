server.port=8080
spring.application.name=carrentz
# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/CarRentz?useSSL=false&serverTimezone=UTC
spring.datasource.username=carrentz
spring.datasource.password=rentalsmadeeasy
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP settings
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=100
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA settings
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true # See https://stackoverflow.com/questions/60409066/difference-between-hibernate-show-sql-spring-jpa-show-sql
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect # Logs keep saying this is deprecated, so not using it

# server.servlet.context-path=/carrentz

# Spring Boot Actuator settings
management.security.enabled=false
management.server.port=8081
# Uncomment to change the port for actuator endpoints
management.endpoints.web.exposure.include=health, info, metrics
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator
management.endpoints.web.path-mapping.health=healthcheck
management.endpoints.web.path-mapping.info=info
#management.endpoint.health.enabled=true # Uncomment to enable the health endpoint
#management.endpoint.info.enabled=true # Uncomment to enable the info endpoint


# Logging configuration
#logging.level.org.springframework=DEBUG
logging.level.com.sonny.carrentz.controller.RentalController=DEBUG
logging.level.com.sonny.carrentz.repository.RentalsUnavailable=DEBUG
# logging.level.com.shoshone=DEBUG
logging.file.name=logs/carrentz.log